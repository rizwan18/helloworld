<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ResumeMatch AI</title>
<style>
:root{--bg:#f6f3ee;--card:#fffdf9;--tx:#1d2433;--mu:#6b7385;--bd:#e6e0d5;--ac:#1f3a5f;--gd:#b08d57;--ok:#2e7d5b;--wa:#b07a2a;--er:#b3402f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1a1f29;--tx:#eee9df;--mu:#9ea6b6;--bd:#2b3240;--ac:#8fb0e6;--gd:#d1ae74;--ok:#4cc38a;--wa:#e0a64a;--er:#f2766b}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1a1f29;--tx:#eee9df;--mu:#9ea6b6;--bd:#2b3240;--ac:#8fb0e6;--gd:#d1ae74;--ok:#4cc38a;--wa:#e0a64a;--er:#f2766b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 Georgia,'Times New Roman',serif}
h1,h2,h3,button,label,.sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
main{max-width:1080px;margin:0 auto;padding:20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:8px 0 24px}
.logo{font:700 18px -apple-system,Helvetica,sans-serif}.logo b{color:var(--ac)}
.hero{text-align:center;padding:36px 0 28px}.hero h1{font-size:clamp(30px,6vw,48px);margin:0 0 12px;line-height:1.1}
.hero p{max-width:620px;margin:0 auto 22px;color:var(--mu);font-size:17px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:11px 20px;font-size:15px;font-weight:600;cursor:pointer}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:6px 12px;font-size:13px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px}
.card h3{margin:0 0 8px;font-size:16px}.mu{color:var(--mu)}.sm{font-size:13px}
input,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:9px 11px;font:inherit;margin-bottom:8px}
textarea{min-height:230px;resize:vertical}label{font-size:13px;font-weight:600;display:block;margin-bottom:3px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.row{display:flex;justify-content:space-between;gap:10px;font:13px -apple-system,Helvetica,sans-serif;margin:10px 0 4px}
.tag{display:inline-block;font:600 11px -apple-system,Helvetica,sans-serif;padding:2px 8px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.strong{color:var(--ok)}.partial{color:var(--wa)}.missing{color:var(--mu)}.none{color:var(--er)}
.req{border-top:1px solid var(--bd);padding:10px 0}.req:first-child{border:0}
.big{font:700 44px -apple-system,Helvetica,sans-serif}
.hide{display:none}.tabs{display:flex;gap:6px;margin:16px 0;flex-wrap:wrap}
.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 14px;cursor:pointer}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.status{padding:12px;border:1px dashed var(--bd);border-radius:8px;margin:12px 0;font:14px -apple-system,Helvetica,sans-serif}
.err{color:var(--er)}.wide{overflow-x:auto}

.btn{border-radius:10px}.btn:not(.sec){color:#fff}:root:not([data-theme="light"]) .btn:not(.sec){color:#12151c}
.card{border-radius:16px;box-shadow:0 1px 2px rgba(29,36,51,.05),0 8px 24px rgba(29,36,51,.05)}
main{max-width:1180px;padding:20px 24px 48px}
.hero{padding:20px 0 8px}.hero h1{font:600 clamp(30px,5vw,44px)/1.15 Georgia,serif;letter-spacing:-.01em;margin:0 0 8px}.hero p{font-size:17px;margin:0 auto}
.flow{display:flex;align-items:center;justify-content:center;gap:0;margin:22px auto 26px;max-width:640px;font-family:-apple-system,'Segoe UI',Helvetica,sans-serif}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--mu);width:110px;text-align:center}
.dot{width:48px;height:48px;border-radius:50%;border:2px solid var(--bd);background:var(--card);display:grid;place-items:center;color:var(--mu);transition:.25s}
.dot svg{width:22px;height:22px}.step.done{color:var(--tx)}.step.done .dot{background:var(--ac);border-color:var(--ac);color:#fff}
.line{flex:1;height:2px;background:var(--bd);margin:0 -6px 22px}
.inputs{gap:22px}.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px}.ch .ic{width:38px;height:38px;border-radius:10px;background:color-mix(in srgb,var(--gd) 18%,transparent);color:var(--gd);display:grid;place-items:center}.ch .ic svg{width:20px;height:20px}
.ch h3{margin:0;font-size:18px}.inputs textarea{min-height:380px;font:15px/1.6 -apple-system,'Segoe UI',Helvetica,sans-serif;background:var(--bg);border-radius:12px;padding:16px;margin:0}
.inputs textarea:focus,.action input:focus{outline:2px solid var(--gd);outline-offset:0}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font:13px -apple-system,Helvetica,sans-serif}
.up{cursor:pointer;border:1px solid var(--bd);border-radius:8px;padding:5px 12px;color:var(--ac)}.up:hover{border-color:var(--gd)}
.action{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin:26px 0 8px}
.action input{width:280px;margin:0;border-radius:10px}.action .btn{padding:14px 34px;font-size:16px}
.chips{display:flex;gap:8px 22px;justify-content:center;flex-wrap:wrap;margin-top:22px;color:var(--mu);font:13px -apple-system,Helvetica,sans-serif}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.bar i{background:var(--gd)}.tag{border-radius:6px}
@media(max-width:640px){.step{width:80px}.action input{width:100%}}
</style></head><body><main>
<nav><div class="logo">Resume<b>Match</b> AI</div><a class="btn sec sm" href="./price-lookup.html">Stock Price Lookup</a></nav>

<section id="landing">
<div class="hero"><h1>Tailor your resume to the role</h1><p class="mu">Truthful, ATS-friendly, built on your real experience.</p></div>
<div class="flow"><div class="step" id="s1"><div class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></div>Resume</div><div class="line"></div><div class="step" id="s2"><div class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg></div>Job</div><div class="line"></div><div class="step" id="s3"><div class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.4 5.6L20 9.5l-4.2 3.9 1.2 5.8L12 16.2 7 19.2l1.2-5.8L4 9.5l5.6-.9z"/></svg></div>Tailored</div></div>
<div class="grid g2 inputs" id="how">
<div class="card"><div class="ch"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg></span><h3>Your resume</h3></div>
<textarea id="rs" placeholder="Paste your resume here…" oninput="cc()"></textarea>
<div class="foot"><span class="mu">Edit freely before analysing</span><label class="up">Upload .txt<input type="file" accept=".txt,.md" hidden onchange="load(this,'rs')"></label></div></div>
<div class="card"><div class="ch"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/></svg></span><h3>Job description</h3></div>
<textarea id="jd" placeholder="Paste the job description here…" oninput="cc()"></textarea>
<div class="foot"><span id="cnt" class="mu">0 characters</span><label class="up">Upload .txt<input type="file" accept=".txt,.md" hidden onchange="load(this,'jd')"></label></div></div>
</div>
<div class="action"><input id="ji" placeholder="Focus (optional), e.g. people leadership"><input id="ak" type="password" autocomplete="off" placeholder="Anthropic API key (saved in this browser)" oninput="saveKey()"><button class="btn" id="go" onclick="run()">Analyse &amp; Tailor</button><button class="btn sec" onclick="clr()">Clear</button></div>
<div id="st" class="status hide"></div>
<div class="chips"><span>✓ No fabricated experience</span><span>✓ ATS-friendly</span><span>✓ Evidence-based</span><span>✓ You stay in control</span></div>
</section>

<section id="out" class="hide">
<div class="tabs" id="tabs"></div>
<div id="t-match"></div><div id="t-gaps" class="hide"></div><div id="t-changes" class="hide"></div>
<div id="t-resume" class="hide"></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={reqs:[],before:[],after:{},resume:null,changes:[],issues:[],confirmed:{},text:''};
function go(){$('how').scrollIntoView({behavior:'smooth'});$('rs').focus({preventScroll:true})}
function cc(){$('cnt').textContent=$('jd').value.length.toLocaleString()+' characters';const r=$('rs').value.trim().length>40,j=$('jd').value.trim().length>40;$('s1').classList.toggle('done',r);$('s2').classList.toggle('done',j);$('s3').classList.toggle('done',r&&j)}
function load(el,t){const f=el.files[0];if(!f)return;if(!/\.(txt|md)$/i.test(f.name)){alert('This build reads .txt/.md only. Paste PDF/DOCX text instead.');return}f.text().then(x=>{$(t).value=x;cc()})}
function clr(){['ji','jd','rs'].forEach(i=>$(i).value='');cc()}
function status(m,e){const s=$('st');s.classList.remove('hide');s.className='status'+(e?' err':'');s.textContent=m}

/* ---- Provider abstraction: swap this object to change LLM backend ---- */
const provider={async json(system,data){
 const full=system+'\nReturn ONLY valid JSON, no prose or fences.\nINPUT:\n'+JSON.stringify(data);
 // 1) claude.ai artifact runtime, if present
 if(typeof claude!=='undefined'&&claude&&claude.use){const sample=await claude.use('sample');if(sample)return sample.json(full,{cache:false})}
 // 2) user's own key, kept in this browser only, calling Anthropic directly
 const key=getKey();
 if(key){let r;try{r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5',max_tokens:8000,messages:[{role:'user',content:full}]})})}catch(e){throw new Error('Could not reach Anthropic. Check your connection.')}
  const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error((d.error&&d.error.message)||('Anthropic error '+r.status+'. Check your API key.'));
  return parseJ((d.content||[]).map(c=>c.text||'').join(''))}
 // 3) optional server route
 let res;try{res=await fetch('/api/complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:full})})}catch(e){res=null}
 if(!res||res.status===404||res.status===405)throw new Error('Enter your Anthropic API key in step 3 to use the AI features.');
 let j={};try{j=await res.json()}catch(e){}
 if(!res.ok)throw new Error(j.error||('AI request failed ('+res.status+'). Is ANTHROPIC_API_KEY set on the server?'));
 return parseJ(j.text)}};
function parseJ(x){const t=String(x||'').replace(/^```(?:json)?\s*|\s*```$/g,'').trim();try{return JSON.parse(t)}catch(e){const m=t.match(/[\[{][\s\S]*[\]}]/);if(m)return JSON.parse(m[0]);throw new Error('Model returned invalid JSON. Please retry.')}}
function getKey(){const v=$('ak')&&$('ak').value.trim();if(v)return v;try{return localStorage.getItem('rm_key')||''}catch(e){return ''}}
function saveKey(){try{localStorage.setItem('rm_key',$('ak').value.trim())}catch(e){}}
try{window.addEventListener('DOMContentLoaded',()=>{try{$('ak').value=localStorage.getItem('rm_key')||''}catch(e){}})}catch(e){}

const RULES='Never invent employers, titles, dates, degrees, certifications, technologies, projects, team sizes, budgets, metrics or achievements. Do not alter titles or dates. Do not upgrade participation to ownership. Keep quantified achievements. No inflated adjectives. No keyword stuffing. Use JD terminology only where it accurately reflects existing evidence.';

async function run(){
 const jd=$('jd').value.trim(),rs=$('rs').value.trim();
 if(jd.length<80||rs.length<80){status('Please provide both a job description and a resume.',1);return}
 $('go').disabled=true;S.confirmed={};
 try{
  status('Stage A/B — analysing role and mapping evidence…');
  const a=await provider.json(`You are a recruitment analyst. Analyse the job description and resume independently, then map each major JD requirement (12-20) to exact resume evidence. Output {"role":{"title","seniority","industry","employment","outcomes":[..]},"candidate":{"title","years","industries":[..]},"reqs":[{"id":"r1","text","category":"responsibilities|technical|leadership|domain|qualifications|keywords|achievements","importance":"high|medium|low","status":"strong|partial|missing|none","evidence":["verbatim resume quotes"],"note":"why"}]}. status: strong=clear evidence; partial=related/transferable; missing=no evidence in resume (NOT the same as not a match); none=clearly conflicts. Only quote evidence that really appears.`,{jd,resume:rs,job:jobMeta()});
  S.a=a;S.reqs=a.reqs;S.before=a.reqs.map(r=>({id:r.id,status:r.status}));S.after={};
  await tailor(rs);
 }catch(e){status('Error: '+(e.message||e.code||e),1);$('go').disabled=false}
}
function jobMeta(){return{instructions:$('ji').value}}
async function tailor(rs,fix){
  const conf=Object.keys(S.confirmed).filter(k=>S.confirmed[k]).map(k=>S.reqs.find(r=>r.id==k).text);
  status(fix?'Regenerating affected sections…':'Stage C/D — planning strategy and rewriting…');
  const r=await provider.json(`You are an executive resume writer. First decide a strategy (what to move up, compress, expand, which roles get more space), then rewrite the resume. ${RULES} Structure: header, targeted headline, professional summary (3-4 short paragraphs), grouped core capabilities (only source-supported), 5-8 career highlights, experience (4-7 bullets for highly relevant roles, 3-5 moderate, 1-3 older), education, certifications. Bullets: Action + Scope + Challenge + Outcome. Plain ATS-safe wording. Facts the user explicitly confirmed may be used: ${JSON.stringify(conf)}. Output {"header":{"name","location","phone","email","linkedin"},"headline","summary":[..],"capabilities":[{"group","items":[..]}],"highlights":[..],"experience":[{"company","title","dates","bullets":[..]}],"education":[..],"certifications":[..],"changes":[{"section","change","why"}]}.`,{analysis:S.a,requirements:S.reqs,resume:rs,job:jobMeta(),fix_issues:fix||[]});
  S.resume=r;S.changes=r.changes||[];
  status('Stage E — validating against source resume…');
  const v=await provider.json(`You are an independent fact-checker. Compare the tailored resume to the SOURCE resume. Flag: unsupported claims, invented metrics/technologies, altered dates or titles, new employers, overstated seniority, participation claimed as ownership, keyword stuffing, dropped key achievements. Confirmed extra facts (allowed): ${JSON.stringify(conf)}. Also re-assess each requirement against the TAILORED resume. Output {"pass":bool,"issues":[{"severity":"high|low","section","problem"}],"after":[{"id","status":"strong|partial|missing|none"}]}.`,{source:rs,tailored:r,requirements:S.reqs.map(x=>({id:x.id,text:x.text}))});
  S.issues=v.issues||[];S.after=Object.fromEntries((v.after||[]).map(x=>[x.id,x.status]));
  const bad=S.issues.filter(i=>i.severity==='high');
  if(!v.pass&&bad.length&&!fix){return tailor(rs,bad)}
  S.text=toText(r);$('st').classList.add('hide');$('go').disabled=false;show();
}
const W={high:3,medium:2,low:1},V={strong:1,partial:.5,missing:0,none:0};
function score(getSt,cat){let n=0,d=0;S.reqs.forEach(r=>{if(cat&&r.category!==cat)return;const w=W[r.importance]||1;d+=w;n+=w*(V[getSt(r)]??0)});return d?Math.round(100*n/d):null}
const before=r=>S.confirmed[r.id]?'strong':r.status;
const after=r=>S.confirmed[r.id]?'strong':(S.after[r.id]||r.status);
const CATS=['responsibilities','technical','leadership','domain','qualifications','keywords','achievements'];
function bars(fn){return CATS.map(c=>{const s=score(fn,c);return s===null?'':`<div class="row"><span style="text-transform:capitalize">${c}</span><b>${s}%</b></div><div class="bar"><i style="width:${s}%"></i></div>`}).join('')}
function tag(s){const l={strong:'Strong Match',partial:'Partial Match',missing:'Evidence Missing',none:'Not a Match'}[s]||s;return`<span class="tag ${s}">${l}</span>`}
function show(){
 $('landing').classList.add('hide');$('out').classList.remove('hide');
 $('tabs').innerHTML=[['match','Match Analysis'],['gaps','Gap Analysis'],['changes','What Changed'],['resume','Tailored Resume']].map(([k,l])=>`<button data-k="${k}" onclick="tab('${k}')">${l}</button>`).join('')+'<button onclick="back()">← Edit inputs</button>';
 render();tab(S.cur||'match');
}
function back(){$('out').classList.add('hide');$('landing').classList.remove('hide')}
function tab(k){S.cur=k;['match','gaps','changes','resume'].forEach(x=>$('t-'+x).classList.toggle('hide',x!==k));document.querySelectorAll('#tabs button[data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k===k))}
function render(){
 const b=score(before),a=score(after);
 $('t-match').innerHTML=`<div class="grid g2"><div class="card"><h3>Before tailoring</h3><div class="big">${b}%</div>${bars(before)}</div><div class="card"><h3>After tailoring</h3><div class="big">${a}%</div>${bars(after)}</div></div>
 <p class="mu sm sans">Role alignment is an internal indicator computed from the requirement-by-requirement evidence table below (weighted by importance). It is not an ATS score or a hiring probability.</p>
 <div class="card"><h3>Evidence map</h3>${S.reqs.map(r=>`<div class="req"><div class="row" style="margin-top:0"><b>${esc(r.text)}</b>${tag(before(r))}</div><span class="mu sm">${esc(r.category)} · ${esc(r.importance)} priority</span>${(r.evidence||[]).map(e=>`<div class="sm">“${esc(e)}”</div>`).join('')}<div class="mu sm">${esc(r.note||'')}</div></div>`).join('')}</div>`;
 const g=(s)=>S.reqs.filter(r=>before(r)===s);
 $('t-gaps').innerHTML=`<div class="grid g2"><div class="card"><h3>Already demonstrated</h3>${g('strong').map(r=>`<div class="sm">• ${esc(r.text)}</div>`).join('')||'<span class="mu">—</span>'}</div>
 <div class="card"><h3>Needs greater visibility</h3>${g('partial').map(r=>`<div class="sm">• ${esc(r.text)}</div>`).join('')||'<span class="mu">—</span>'}</div></div>
 <div class="card" style="margin-top:16px"><h3>Potential gaps</h3><p class="mu sm sans">“Not mentioned” does not mean you lack the experience. If you genuinely have it, confirm below and regenerate; unconfirmed items are never added.</p>
 ${S.reqs.filter(r=>r.status==='missing'||r.status==='none').map(r=>`<div class="req"><label style="font-weight:400"><input type="checkbox" style="width:auto;margin:0 8px 0 0" ${S.confirmed[r.id]?'checked':''} onchange="S.confirmed['${r.id}']=this.checked"> ${esc(r.text)} ${tag(r.status)}<br><span class="mu sm">I have this experience and it is accurate.</span></label></div>`).join('')||'<span class="mu">No gaps identified.</span>'}
 <p><button class="btn" onclick="regen()">Regenerate with confirmations</button></p></div>`;
 $('t-changes').innerHTML=`<div class="card"><h3>Changes and reasons</h3>${S.changes.map(c=>`<div class="req"><b class="sans">${esc(c.section)}</b><div>${esc(c.change)}</div><div class="mu sm">Why: ${esc(c.why)}</div></div>`).join('')}</div>
 <div class="card" style="margin-top:16px"><h3>Validation</h3>${S.issues.length?S.issues.map(i=>`<div class="sm">${i.severity==='high'?'⚠':'•'} ${esc(i.section)}: ${esc(i.problem)}</div>`).join(''):'<span class="strong">✓ No unsupported claims, altered dates/titles or invented metrics detected.</span>'}</div>`;
 $('t-resume').innerHTML=`<div class="card"><h3>Edit your tailored resume</h3><p class="mu sm sans">Plain-text, standard headings, ATS-safe. Edit freely, then download.</p><textarea id="fin" style="min-height:560px;font-family:ui-monospace,Menlo,monospace;font-size:13px" oninput="S.text=this.value">${esc(S.text)}</textarea>
 <p><button class="btn" onclick="dl()">Download (.txt)</button> <button class="btn sec" onclick="regen()">Regenerate</button> <button class="btn sec" onclick="navigator.clipboard&&navigator.clipboard.writeText(S.text)">Copy</button></p><span class="mu sm sans">DOCX/PDF export is not in this build.</span></div>`;
}
async function regen(){back();try{$('go').disabled=true;await tailor($('rs').value.trim())}catch(e){status('Error: '+(e.message||e.code),1);$('go').disabled=false}}
function toText(r){const h=r.header||{};const L=[];const H=t=>{L.push('',t.toUpperCase(),'')};
 L.push(h.name||'',[h.location,h.phone,h.email,h.linkedin].filter(Boolean).join(' | '),'',r.headline||'');
 H('Professional Summary');(r.summary||[]).forEach(p=>L.push(p,''));
 H('Core Capabilities');(r.capabilities||[]).forEach(c=>L.push(c.group.toUpperCase()+': '+c.items.join(' | ')));
 H('Career Highlights');(r.highlights||[]).forEach(x=>L.push('- '+x));
 H('Professional Experience');(r.experience||[]).forEach(e=>{L.push('',e.title+' | '+e.company+' | '+e.dates);(e.bullets||[]).forEach(x=>L.push('- '+x))});
 if((r.education||[]).length){H('Education');r.education.forEach(x=>L.push(x))}
